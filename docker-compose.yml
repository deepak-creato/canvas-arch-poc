name: canvas-poc

x-app-env: &app-env
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  DATABASE_URL: ${DATABASE_URL:-postgres://canvas:canvas@postgres:5432/canvas}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  BUCKET_INGEST: ${BUCKET_INGEST:-media-ingest-poc}
  BUCKET_DERIVED: ${BUCKET_DERIVED:-media-derived-poc}
  BUCKET_PUBLISHED: ${BUCKET_PUBLISHED:-media-published-poc}
  QUEUE_LIGHT_PROCESSING_URL: http://localstack:4566/000000000000/${QUEUE_LIGHT_PROCESSING:-light-processing}
  QUEUE_LIGHT_PROCESSING_DLQ_URL: http://localstack:4566/000000000000/${QUEUE_LIGHT_PROCESSING_DLQ:-light-processing-dlq}
  QUEUE_AI_REQUESTS_URL: http://localstack:4566/000000000000/${QUEUE_AI_REQUESTS:-ai-requests}
  QUEUE_TRANSCODE_REQUESTS_URL: http://localstack:4566/000000000000/${QUEUE_TRANSCODE_REQUESTS:-transcode-requests}
  QUEUE_TRANSCODE_REQUESTS_DLQ_URL: http://localstack:4566/000000000000/${QUEUE_TRANSCODE_REQUESTS_DLQ:-transcode-requests-dlq}
  QUEUE_PUBLISH_TASKS_URL: http://localstack:4566/000000000000/${QUEUE_PUBLISH_TASKS:-publish-tasks}
  QUEUE_PUBLISH_TASKS_DLQ_URL: http://localstack:4566/000000000000/${QUEUE_PUBLISH_TASKS_DLQ:-publish-tasks-dlq}
  QUEUE_AI_REQUESTS_DLQ_URL: http://localstack:4566/000000000000/${QUEUE_AI_REQUESTS_DLQ:-ai-requests-dlq}
  SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
  UPLOAD_STAGING_PREFIX: ${UPLOAD_STAGING_PREFIX:-staging/}
  MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-20971520}
  MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-209715200}
  UPLOAD_URL_TTL_SECONDS: ${UPLOAD_URL_TTL_SECONDS:-900}

x-app: &app
  build: ./services/_stub
  restart: unless-stopped
  networks: [canvas-net]
  depends_on:
    localstack: { condition: service_healthy }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  localstack:
    image: localstack/localstack:${LOCALSTACK_IMAGE_TAG:-2026.10.2}
    ports:
      - "127.0.0.1:${HOST_PORT_LOCALSTACK:-4566}:4566"
    environment:
      SERVICES: s3,sqs,events,stepfunctions,sts
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      PERSISTENCE: "0"
      BUCKET_INGEST: ${BUCKET_INGEST:-media-ingest-poc}
      BUCKET_DERIVED: ${BUCKET_DERIVED:-media-derived-poc}
      BUCKET_PUBLISHED: ${BUCKET_PUBLISHED:-media-published-poc}
      QUEUE_LIGHT_PROCESSING: ${QUEUE_LIGHT_PROCESSING:-light-processing}
      QUEUE_LIGHT_PROCESSING_DLQ: ${QUEUE_LIGHT_PROCESSING_DLQ:-light-processing-dlq}
      QUEUE_AI_REQUESTS: ${QUEUE_AI_REQUESTS:-ai-requests}
      QUEUE_AI_REQUESTS_DLQ: ${QUEUE_AI_REQUESTS_DLQ:-ai-requests-dlq}
      QUEUE_TRANSCODE_REQUESTS: ${QUEUE_TRANSCODE_REQUESTS:-transcode-requests}
      QUEUE_TRANSCODE_REQUESTS_DLQ: ${QUEUE_TRANSCODE_REQUESTS_DLQ:-transcode-requests-dlq}
      QUEUE_PUBLISH_TASKS: ${QUEUE_PUBLISH_TASKS:-publish-tasks}
      QUEUE_PUBLISH_TASKS_DLQ: ${QUEUE_PUBLISH_TASKS_DLQ:-publish-tasks-dlq}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
      UPLOAD_STAGING_PREFIX: ${UPLOAD_STAGING_PREFIX:-staging/}
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
      - ./infra/stepfunctions:/opt/stepfunctions:ro
    networks: [canvas-net]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import sys,json,urllib.request as u;
          s=json.load(u.urlopen('http://localhost:4566/_localstack/health'))['services'];
          sys.exit(0 if all(s.get(k) in ('available','running') for k in ('s3','sqs','events','stepfunctions')) else 1)"
      <<: *health
      start_period: 15s

  postgres:
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:${HOST_PORT_POSTGRES:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvas}
      POSTGRES_DB: ${POSTGRES_DB:-canvas}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [canvas-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canvas} -d ${POSTGRES_DB:-canvas}"]
      <<: *health

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS:-6380}:6379"
    networks: [canvas-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *health

  migrate:
    image: postgres:16.4-alpine
    restart: "no"
    entrypoint: ["sh", "/migrate.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://canvas:canvas@postgres:5432/canvas}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./infra/db/migrate.sh:/migrate.sh:ro
    networks: [canvas-net]
    depends_on:
      postgres: { condition: service_healthy }

  canvas-api:
    <<: *app
    build:
      context: ./services
      dockerfile: canvas-api/Dockerfile
    ports:
      - "127.0.0.1:${HOST_PORT_API:-3000}:3000"
    environment:
      <<: *app-env
      SERVICE_NAME: canvas-api
      WORKER_TEST_HOOKS: ${WORKER_TEST_HOOKS:-true}
      PUBLISH_WAIT_SECONDS: ${PUBLISH_WAIT_SECONDS:-2}
      PUBLISH_MAX_ASSET_POLLS: ${PUBLISH_MAX_ASSET_POLLS:-30}
      PUBLISH_CANVAS_TIMEOUT_SECONDS: ${PUBLISH_CANVAS_TIMEOUT_SECONDS:-900}
      PUBLISH_TRANSCODE_TIMEOUT_SECONDS: ${PUBLISH_TRANSCODE_TIMEOUT_SECONDS:-120}
      PUBLISH_MAX_ATTEMPTS: ${PUBLISH_MAX_ATTEMPTS:-5}
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      <<: *health

  light-worker:
    <<: *app
    build:
      context: ./services
      dockerfile: light-worker/Dockerfile
    environment:
      <<: *app-env
      SERVICE_NAME: light-worker
      # Local POC only: lets tests inject failures through a job's payload (fail_mode).
      WORKER_TEST_HOOKS: ${WORKER_TEST_HOOKS:-true}
      PORT: "3101"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101/healthz"]
      <<: *health

  ai-worker:
    <<: *app
    build:
      context: ./services
      dockerfile: ai-worker/Dockerfile
    environment:
      <<: *app-env
      SERVICE_NAME: ai-worker
      # Local POC only: lets tests inject failures through the generation request (test_fail).
      WORKER_TEST_HOOKS: ${WORKER_TEST_HOOKS:-true}
      PORT: "3102"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3102/healthz"]
      <<: *health

  mock-transcoder:
    <<: *app
    build:
      context: ./services
      dockerfile: mock-transcoder/Dockerfile
    volumes:
      # Valid MP4 the mock places at final output keys. Nothing is transcoded.
      - ./fixtures:/fixtures:ro
    ports:
      - "127.0.0.1:${HOST_PORT_TRANSCODER:-3103}:3103"
    environment:
      <<: *app-env
      SERVICE_NAME: mock-transcoder
      # Local POC only: fail_mode in the transcode request/job payload injects failures.
      WORKER_TEST_HOOKS: ${WORKER_TEST_HOOKS:-true}
      MOCK_TRANSCODE_LATENCY_MS: ${MOCK_TRANSCODE_LATENCY_MS:-1500}
      TRANSCODE_FIXTURE_PATH: /fixtures/sample.mp4
      PORT: "3103"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3103/healthz"]
      <<: *health

  gc-worker:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_NAME: gc-worker
      PORT: "3104"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3104/healthz"]
      <<: *health

networks:
  canvas-net:

volumes:
  pgdata:
