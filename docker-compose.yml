name: canvas-poc

x-app-env: &app-env
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  DATABASE_URL: ${DATABASE_URL:-postgres://canvas:canvas@postgres:5432/canvas}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  BUCKET_INGEST: ${BUCKET_INGEST:-media-ingest-poc}
  BUCKET_DERIVED: ${BUCKET_DERIVED:-media-derived-poc}
  BUCKET_PUBLISHED: ${BUCKET_PUBLISHED:-media-published-poc}
  QUEUE_LIGHT_PROCESSING_URL: http://localstack:4566/000000000000/${QUEUE_LIGHT_PROCESSING:-light-processing}
  QUEUE_LIGHT_PROCESSING_DLQ_URL: http://localstack:4566/000000000000/${QUEUE_LIGHT_PROCESSING_DLQ:-light-processing-dlq}
  QUEUE_AI_REQUESTS_URL: http://localstack:4566/000000000000/${QUEUE_AI_REQUESTS:-ai-requests}
  QUEUE_AI_REQUESTS_DLQ_URL: http://localstack:4566/000000000000/${QUEUE_AI_REQUESTS_DLQ:-ai-requests-dlq}
  SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
  UPLOAD_STAGING_PREFIX: ${UPLOAD_STAGING_PREFIX:-staging/}

x-app: &app
  build: ./services/_stub
  restart: unless-stopped
  networks: [canvas-net]
  depends_on:
    localstack: { condition: service_healthy }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  localstack:
    image: localstack/localstack:${LOCALSTACK_IMAGE_TAG:-2026.10.2}
    ports:
      - "127.0.0.1:${HOST_PORT_LOCALSTACK:-4566}:4566"
    environment:
      SERVICES: s3,sqs,events,stepfunctions,sts
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      PERSISTENCE: "0"
      BUCKET_INGEST: ${BUCKET_INGEST:-media-ingest-poc}
      BUCKET_DERIVED: ${BUCKET_DERIVED:-media-derived-poc}
      BUCKET_PUBLISHED: ${BUCKET_PUBLISHED:-media-published-poc}
      QUEUE_LIGHT_PROCESSING: ${QUEUE_LIGHT_PROCESSING:-light-processing}
      QUEUE_LIGHT_PROCESSING_DLQ: ${QUEUE_LIGHT_PROCESSING_DLQ:-light-processing-dlq}
      QUEUE_AI_REQUESTS: ${QUEUE_AI_REQUESTS:-ai-requests}
      QUEUE_AI_REQUESTS_DLQ: ${QUEUE_AI_REQUESTS_DLQ:-ai-requests-dlq}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-3}
      UPLOAD_STAGING_PREFIX: ${UPLOAD_STAGING_PREFIX:-staging/}
    volumes:
      - ./infra/localstack/init:/etc/localstack/init/ready.d:ro
    networks: [canvas-net]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import sys,json,urllib.request as u;
          s=json.load(u.urlopen('http://localhost:4566/_localstack/health'))['services'];
          sys.exit(0 if all(s.get(k) in ('available','running') for k in ('s3','sqs','events','stepfunctions')) else 1)"
      <<: *health
      start_period: 15s

  postgres:
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:${HOST_PORT_POSTGRES:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvas}
      POSTGRES_DB: ${POSTGRES_DB:-canvas}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [canvas-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canvas} -d ${POSTGRES_DB:-canvas}"]
      <<: *health

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS:-6380}:6379"
    networks: [canvas-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *health

  canvas-api:
    <<: *app
    ports:
      - "127.0.0.1:${HOST_PORT_API:-3000}:3000"
    environment:
      <<: *app-env
      SERVICE_NAME: canvas-api
      PORT: "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      <<: *health

  light-worker:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_NAME: light-worker
      PORT: "3101"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101/healthz"]
      <<: *health

  ai-worker:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_NAME: ai-worker
      PORT: "3102"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3102/healthz"]
      <<: *health

  mock-transcoder:
    <<: *app
    ports:
      - "127.0.0.1:${HOST_PORT_TRANSCODER:-3103}:3103"
    environment:
      <<: *app-env
      SERVICE_NAME: mock-transcoder
      PORT: "3103"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3103/healthz"]
      <<: *health

  gc-worker:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_NAME: gc-worker
      PORT: "3104"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3104/healthz"]
      <<: *health

networks:
  canvas-net:

volumes:
  pgdata:
